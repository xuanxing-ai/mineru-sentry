name: mineru-sentry

services:
  # ----------------------------------------------------------------------------
  # 1. MinerU-Sentry (Standby Gateway & Orchestrator)
  # ----------------------------------------------------------------------------
  sentry:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: mineru-sentry:latest
    container_name: mineru-sentry
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SENTRY_HOST=0.0.0.0
      - SERVICE_PORT=8080
      - LOG_PATH=/app/logs
      - LOG_NAME=mineru-sentry
      - POSTGRES_URL=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=mineru_sentry
      - POSTGRES_USERNAME=mineru_admin
      - POSTGRES_PASSWORD=mineru_password
      - MINERU_WORKER_CONTAINER_NAME=mineru_gpu_worker
      - MINERU_API_URL=http://mineru_worker:8000
      - IDLE_TIMEOUT_SECONDS=900
      - SHARED_DATA_DIR=/usr/model/MinerU/data
      - MINERU_CONFIG_FILE=/usr/model/MinerU/mineru.json
    volumes:
      # Docker socket to allow Sentry to start/stop the GPU worker container
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared mount for models, configuration, and data
      - /usr/model/MinerU:/usr/model/MinerU
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mineru_net

  # ----------------------------------------------------------------------------
  # 2. MinerU GPU Worker (RTX 5090 Compute Engine - Scale-to-Zero managed)
  # ----------------------------------------------------------------------------
  mineru_worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    image: mineru:5090
    container_name: mineru_gpu_worker
    restart: "no" # Managed on-demand by mineru-sentry
    ports:
      - "8000:8000"
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    shm_size: 32g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - MINERU_TOOLS_CONFIG_JSON=/usr/model/MinerU/mineru.json
      - MINERU_MODEL_SOURCE=local
      - MINERU_API_OUTPUT_ROOT=/usr/model/MinerU/data/worker_output
      - MINERU_PROCESSING_WINDOW_SIZE=64
    volumes:
      - /usr/model/MinerU:/usr/model/MinerU
    networks:
      - mineru_net

  # ----------------------------------------------------------------------------
  # 3. PostgreSQL Database (Task Persistence, History & Breakpoint Resume)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mineru-postgres
    restart: always
    environment:
      POSTGRES_USER: mineru_admin
      POSTGRES_PASSWORD: mineru_password
      POSTGRES_DB: mineru_sentry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mineru_admin -d mineru_sentry"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mineru_net

volumes:
  pgdata:
    driver: local

networks:
  mineru_net:
    driver: bridge
